[package]
name = "supernsh-icons"
description = "Every Iconify icon set for Native Shell apps: typed SVG icons behind one Cargo feature per set, and icon-font glyphs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["nshm", "nsh", "icons", "iconify", "svg"]
# The published crate takes the sets from the data crates: crates.io allows 10 MB per crate.
include = ["src/**", "build.rs", "Cargo.toml", "nsh.json", "tsx/**"]

[lib]
name = "supernsh_icons"
path = "src/lib.rs"

[dependencies]
nsh-core = "0.6.0"

[build-dependencies]
nsh-icons-codegen = { path = "../nsh-icons-codegen", version = "0.1.0" }
supernsh-icons-data-1 = { path = "../nsh-icons-data-1", version = "0.1.0", optional = true }
supernsh-icons-data-2 = { path = "../nsh-icons-data-2", version = "0.1.0", optional = true }
supernsh-icons-data-3 = { path = "../nsh-icons-data-3", version = "0.1.0", optional = true }

[dev-dependencies]
nsh-engine = { version = "0.6.0", default-features = false }
nsh-testing = { version = "0.6.0", default-features = false }

[features]
default = []
# The data crates; a set turns on the one that carries it.
data-1 = ["dep:supernsh-icons-data-1"]
data-2 = ["dep:supernsh-icons-data-2"]
data-3 = ["dep:supernsh-icons-data-3"]
# One feature per Iconify set; turn on only the sets the app uses.
# BEGIN GENERATED SETS (tools/fetch-data.ts)
akar-icons = ["data-1"]
ant-design = ["data-1"]
bi = ["data-2"]
bx = ["data-3"]
carbon = ["data-3"]
circle-flags = ["data-2"]
codicon = ["data-3"]
devicon = ["data-2"]
fa7-brands = ["data-1"]
fa7-regular = ["data-3"]
fa7-solid = ["data-1"]
fe = ["data-1"]
flag = ["data-1"]
fluent = ["data-2"]
heroicons = ["data-3"]
hugeicons = ["data-2"]
iconoir = ["data-1"]
ion = ["data-1"]
line-md = ["data-3"]
logos = ["data-1"]
lucide = ["data-1"]
majesticons = ["data-2"]
material-symbols = ["data-1"]
mdi = ["data-3"]
mingcute = ["data-3"]
mynaui = ["data-3"]
octicon = ["data-2"]
ph = ["data-2"]
radix-icons = ["data-2"]
ri = ["data-2"]
simple-icons = ["data-3"]
solar = ["data-3"]
streamline = ["data-1"]
svg-spinners = ["data-1"]
tabler = ["data-2"]
# END GENERATED SETS
