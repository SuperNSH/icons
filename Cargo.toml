[package]
name = "supernsh-icons"
description = "Icons for Native Shell (NSH) apps, in Rust and TSX: one Icon component, icon-font glyphs, and a crate per Iconify set"
# Not inherited: `nsh add --path` reads the version here.
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/SuperNSH/icons"
authors = ["hmziqrs"]
readme = "README.md"
keywords = ["nshm", "nsh", "icons", "iconify", "svg"]
include = ["/Cargo.toml", "/LICENSE", "/NOTICE.md", "/README.md", "/nsh.json", "/src/**", "/tsx/**"]

[workspace]
members = ["sets/*"]
exclude = ["examples"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
repository = "https://github.com/SuperNSH/icons"
authors = ["hmziqrs"]

[workspace.dependencies]
supernsh-icons = { path = ".", version = "0.2.0" }
nsh-core = "0.7.1"

[lib]
name = "supernsh_icons"

[dependencies]
# Icons are SVG: without the feature the native backends draw nothing for them.
nsh-core = { workspace = true, features = ["svg"] }

[dev-dependencies]
nsh-core = { workspace = true, features = ["declarations"] }
nsh-engine = { version = "0.7.1", default-features = false }
nsh-testing = { version = "0.7.1", default-features = false }
supernsh-icons-logos = { path = "sets/logos" }
supernsh-icons-lucide = { path = "sets/lucide" }
