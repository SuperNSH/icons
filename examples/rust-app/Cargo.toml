[package]
name = "rust-app"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-base = "0.7.1"
nsh-core = "0.7.1"
supernsh-icons = { path = "../.." }
supernsh-icons-logos = { path = "../../sets/logos" }
supernsh-icons-lucide = { path = "../../sets/lucide" }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.7.1", default-features = false, features = ["svg"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.7.1", default-features = false, features = ["svg"] }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.7.1", default-features = false, features = ["svg"] }

[dev-dependencies]
nsh-engine = { version = "0.7.1", default-features = false }
nsh-testing = { version = "0.7.1", default-features = false }
